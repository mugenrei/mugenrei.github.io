<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>mugenrei — finding that page</title>
  <script>
    (function () {
      var path = window.location.pathname.replace(/^\/+/, '');
      if (!path) return;
      var target = window.location.origin + '/?p=' + encodeURIComponent(path);
      if (window.location.search) target += '&' + window.location.search.slice(1);
      if (window.location.hash) target += window.location.hash;
      window.location.replace(target);
    }());
  </script>
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;color:#eee5f5;background:radial-gradient(circle at 50% 0,#3b2852,transparent 42rem),#0d0b17;font:15px/1.5 "Segoe UI",sans-serif}.panel{width:min(440px,100%);overflow:hidden;text-align:center;border:1px solid #7c6990;border-radius:8px;background:linear-gradient(#352b4c,#1d182e);box-shadow:inset 0 1px #ffffff32,0 14px 40px #0009}.chrome{padding:12px;background:linear-gradient(#675575,#3a304e 48%,#29213d 52%,#483957);border-bottom:1px solid #8d789c;font:600 17px Georgia,serif}.body{padding:28px}.brand{margin:0 0 16px;color:#f6eaff;font-size:38px;font-weight:300;letter-spacing:.07em;text-shadow:0 0 8px #cd8eec}.body p{margin:0;color:#d0c3da}.dots::after{content:"";animation:dots 1.5s steps(4,end) infinite}@keyframes dots{25%{content:"."}50%{content:".."}75%,100%{content:"..."}}@media(prefers-reduced-motion:reduce){.dots::after{content:"...";animation:none}}
  </style>
</head>
<body>
  <main class="panel">
    <div class="chrome">Finding that page</div>
    <div class="body"><p class="brand">mugenrei</p><p>Taking you to the right place<span class="dots" aria-hidden="true"></span></p></div>
  </main>
</body>
</html>
